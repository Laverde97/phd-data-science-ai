project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "semesters/**/*.qmd"
    - "research/**/*.qmd"
    # El informe del Taller 03 se compila fuera del sitio (necesita Python + datos).
    # Se publica como PDF/QMD estático; el CI de GitHub Pages no lo ejecuta.
    - "!semesters/semester-01/machine-learning/workshops/workshop-03-regresion-lineal-viviendas.qmd"
    # El informe del Taller Final se compila fuera del sitio; se publica como PDF estático.
    - "!semesters/semester-01/machine-learning/workshops/taller-final/informe_taller_final_clinica.qmd"
    # Fuentes de las guías de la Clase 02 de Deep Learning I: se compilan fuera del sitio (ejecutan código).
    - "!semesters/semester-01/deep-learning-1/week-02/class-02/guides-source/"
  resources:
    - "semesters/semester-01/machine-learning/workshops/workshop-03-regresion-lineal-viviendas.ipynb"
    - "semesters/semester-01/machine-learning/workshops/workshop-03-regresion-lineal-viviendas.qmd"
    - "semesters/semester-01/machine-learning/workshops/workshop-03-regresion-lineal-viviendas.pdf"
    - "semesters/semester-01/machine-learning/workshops/taller-final/Taller_Final_Clinica_ML.sql"
    - "semesters/semester-01/machine-learning/workshops/taller-final/Taller_Clinica_Machine_Learning_LAVERDE.ipynb"
    - "semesters/semester-01/machine-learning/workshops/taller-final/Taller_Final_Segmentacion_Clinica_PCA_KMeans.pdf"
    # Deep Learning I · Clase 02: guía PDF y laboratorio propios (estáticos; el notebook no se ejecuta).
    - "semesters/semester-01/deep-learning-1/week-02/class-02/resources/Guia_Profesional_Redes_Neuronales.pdf"
    - "semesters/semester-01/deep-learning-1/week-02/class-02/notebooks/Guia_Redes_Neuronales_Practicas.ipynb"
    # Deep Learning I · Clase 02: guías académicas propias de los cuatro notebooks (PDF estáticos).
    - "semesters/semester-01/deep-learning-1/week-02/class-02/resources/guides/01_Guia_Academica_Regresion_TensorFlow.pdf"
    - "semesters/semester-01/deep-learning-1/week-02/class-02/resources/guides/02_Guia_Academica_Clasificacion_PyTorch.pdf"
    - "semesters/semester-01/deep-learning-1/week-02/class-02/resources/guides/03_Guia_Academica_Pipeline_MNIST_TensorFlow.pdf"
    - "semesters/semester-01/deep-learning-1/week-02/class-02/resources/guides/04_Guia_Academica_Series_Temporales_Lightning_Keras_JAX.pdf"
    # Deep Learning I · Tarea 01: notebook original con salidas (estático; no se ejecuta).
    - "semesters/semester-01/deep-learning-1/workshops/workshop-01-cub200-multimodal/workshop-01-cub200-multimodal.ipynb"
    # Deep Learning I · Tarea 01: PDF completo del notebook (estático; copia binaria, no se procesa).
    - "semesters/semester-01/deep-learning-1/workshops/workshop-01-cub200-multimodal/Tarea_01_Deep_Learning_I_CUB200_Notebook_Completo.pdf"

website:
  title: "PhD · Data Science & Artificial Intelligence"
  description: "Bitácora técnica, portafolio y sitio académico reproducible del Doctorado en Ciencia de Datos e Inteligencia Artificial."
  site-url: "https://laverde97.github.io/phd-data-science-ai/"
  repo-url: "https://github.com/Laverde97/phd-data-science-ai"
  repo-actions: [source]
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  reader-mode: true
  back-to-top-navigation: true
  page-navigation: true
  bread-crumbs: true
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    logo: assets/logo.svg
    left:
      - href: index.qmd
        text: Inicio
      - text: Semestres
        menu:
          - href: semesters/semester-01/index.qmd
            text: Semestre 1
      - href: research/index.qmd
        text: Investigación
    right:
      - icon: github
        href: "https://github.com/Laverde97/phd-data-science-ai"
        aria-label: GitHub
  sidebar:
    - id: research
      title: "Investigación"
      style: floating
      collapse-level: 1
      contents:
        - href: research/index.qmd
          text: Panorama
        - section: "Secciones"
          contents:
            - research/literature/index.qmd
            - research/research-questions/index.qmd
            - research/experiments/index.qmd
            - research/results/index.qmd
            - research/meetings/index.qmd
            - research/progress/index.qmd
            - research/manuscripts/index.qmd
            - research/presentations/index.qmd
  page-footer:
    left: "Doctoral learning repository · Data Science & Artificial Intelligence"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-expand: 2
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    anchor-sections: true
    link-external-icon: true
    link-external-newwindow: true

execute:
  freeze: auto
